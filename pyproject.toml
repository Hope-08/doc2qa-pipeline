[project]
name = "doc2qa-pipeline"
version = "0.1.0"
description = "企业知识库 QA 数据自动生成平台"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Your Team", email = "team@example.com"}
]
keywords = ["qa-generation", "rag", "document-parsing", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # LLM & Pipeline 核心（轻量，无 CUDA 依赖）
    "langchain-openai>=0.1.0",
    "prefect>=3.0.0",

    # 数据格式
    "datasets>=2.20.0",
    "pandas>=2.0.0",

    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# 本地多引擎文档解析
parsing = [
    "docling>=2.0.0",
    "unstructured[pdf,docx]>=0.14.0",
    "ocrmypdf>=16.0.0",
    "PyMuPDF>=1.24.0",
    "camelot-py[cv]>=0.11.0",
    "img2table>=1.2.0",
]

# QA 评估框架
qa = [
    "langchain-core>=0.2.0",
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
]

# API 服务
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.9",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

all = [
    "doc2qa-pipeline[parsing,qa,api,dev]",
]

[project.scripts]
doc2qa = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "parsing", "chunking", "qa_generation", "qa_filtering", "export", "pipeline", "utils"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
